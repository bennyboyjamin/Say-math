<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>PhotoFix AI</title>
</head>
<body>
  <main class="app">
    <header><div class="logo">✦</div><div><h1>PhotoFix AI</h1><p>Make every photo look better.</p></div></header>

    <section class="card">
      <label class="upload" for="fileInput">
        <span class="big">＋</span>
        <strong>Choose a Photo</strong>
        <small>JPG, PNG, HEIC* supported by your browser</small>
      </label>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </section>

    <section id="editor" class="hidden">
      <div class="preview card">
        <canvas id="canvas"></canvas>
        <div class="badge" id="badge">Original</div>
      </div>

      <div class="compare">
        <button id="originalBtn">Original</button>
        <button id="fixedBtn" class="active">Fixed</button>
      </div>

      <button class="primary" id="autoBtn">✨ Auto Fix</button>

      <section class="tools card">
        <h2>Fine tune</h2>
        <label>Brightness <span id="brightnessVal">100</span>
          <input id="brightness" type="range" min="60" max="160" value="100">
        </label>
        <label>Contrast <span id="contrastVal">100</span>
          <input id="contrast" type="range" min="60" max="160" value="100">
        </label>
        <label>Color <span id="saturationVal">100</span>
          <input id="saturation" type="range" min="0" max="180" value="100">
        </label>
        <label>Warmth <span id="warmthVal">0</span>
          <input id="warmth" type="range" min="-30" max="30" value="0">
        </label>
      </section>

      <div class="actions">
        <button id="resetBtn">↺ Reset</button>
        <button id="saveBtn" class="save">Save Photo</button>
      </div>
      <p class="note">Version 1 enhances photos locally on your device. Your photo is not uploaded to a server.</p>
    </section>
  </main>
<script src="app.js"></script>
</body>
</html>
