{id:'d8',band:3,q:'A fair coin is flipped 3 times. What is the probability of getting at least one head?',ch:['1/8','3/8','1/2','3/4','7/8'],a:4,st:'complement',hint:'What is the only way to get NO heads?',sol:['There are 2 × 2 × 2 = 8 equally likely outcomes.','Only one outcome has no heads: tails, tails, tails.','So 8 − 1 = 7 outcomes have at least one head: 7/8.']},
{id:'d9',band:3,q:'Two trains are 300 km apart on the same track. They travel toward each other, one at 70 km/h and the other at 80 km/h. How long until they meet?',ch:['1.5 hours','2 hours','2.5 hours','3 hours','4 hours'],a:1,st:'rates',hint:'How much does the gap between them shrink every hour?',sol:['Each hour the gap shrinks by 70 + 80 = 150 km.','300 km ÷ 150 km per hour = 2 hours.','They meet after 2 hours.']},
{id:'d10',band:3,q:'What is the smallest positive integer that has exactly 6 positive divisors?',ch:['12','18','20','30','32'],a:0,st:'guess',hint:'Check the answer choices, starting with the smallest. List each number’s divisors.',sol:['Divisors of 12: 1, 2, 3, 4, 6, 12. That is 6 divisors.','Every number from 1 to 11 has at most 4 divisors, so none of them works.','The answer is 12.']},
{id:'e1',band:3,q:'How many three-digit numbers have all odd digits that strictly increase from left to right (like 137)?',ch:['5','10','15','20','60'],a:1,st:'list',hint:'Once you choose three different odd digits, how many ways can they be put in increasing order?',sol:['The odd digits are 1, 3, 5, 7, 9.','Any 3 different ones can be arranged in increasing order in exactly one way.','Choosing 3 of 5: (5 × 4 × 3) ÷ (3 × 2 × 1) = 10.']},
{id:'e2',band:3,q:'What is the smaller angle between the hour hand and the minute hand of a clock at 4:20?',ch:['0°','5°','10°','20°','30°'],a:2,st:'break',hint:'The hour hand doesn’t sit exactly on the 4. It moves ½° every minute.',sol:['Minute hand: 20 minutes × 6° = 120° from the 12.','Hour hand: 4 × 30° + 20 × ½° = 130° from the 12.','The angle between them is 130° − 120° = 10°.']},
{id:'e3',band:3,q:'Ava can paint a fence alone in 6 hours. Ben can paint the same fence alone in 3 hours. How long will it take if they paint it together?',ch:['1.5 hours','2 hours','2.5 hours','4.5 hours','9 hours'],a:1,st:'rates',hint:'What fraction of the fence does each person paint in one hour?',sol:['Ava paints 1/6 of the fence per hour; Ben paints 1/3 = 2/6.','Together: 1/6 + 2/6 = 3/6 = 1/2 of the fence per hour.','The whole fence takes 2 hours.']},
{id:'e4',band:3,q:'A 40-liter drink is 25% juice and the rest is water. How many liters of pure juice must be added so the drink becomes 40% juice?',ch:['4','6','8','10','12'],a:3,st:'totals',hint:'The amount of water never changes. What percent of the new drink is water?',sol:['Water: 75% of 40 = 30 liters, and it stays 30 liters.','In the new drink, water is 60%. So 60% of the total = 30, and the total is 50 liters.','50 − 40 = 10 liters of juice must be added.']},
{id:'e5',band:3,q:'How many positive divisors does 72 have?',ch:['6','8','10','12','14'],a:3,st:'list',hint:'List divisor pairs: 1 × 72, 2 × 36, …',sol:['Pairs: 1 × 72, 2 × 36, 3 × 24, 4 × 18, 6 × 12, 8 × 9.','That is 6 pairs, so 12 divisors.','Shortcut: 72 = 2³ × 3², and (3 + 1) × (2 + 1) = 12.']},
{id:'e6',band:3,q:'What is the units digit of 7³⁵?',ch:['1','3','5','7','9'],a:1,st:'pattern',hint:'Write the units digits of 7¹, 7², 7³, 7⁴, 7⁵… and look for a repeat.',sol:['Units digits: 7, 9, 3, 1, then 7, 9, 3, 1 again.','The cycle has length 4. 35 = 4 × 8 + 3.','So 7³⁵ ends like 7³, which ends in 3.']},
{id:'e7',band:3,q:'A right triangle with legs of 3 is cut off each corner of a 10 × 10 square, leaving an octagon. What is the area of the octagon?',fig:'oct',ch:['64','76','82','88','91'],a:2,st:'complement',hint:'Find the area of the square, then subtract what was cut away.',sol:['The square has area 10 × 10 = 100.','Each corner triangle has area ½ × 3 × 3 = 4.5, and there are 4: 18.','100 − 18 = 82.']},
{id:'e8',band:3,q:'A 13-foot ladder leans against a wall. Its foot is 5 feet from the wall. How high up the wall does the ladder reach?',fig:'ladder',ch:['8 ft','10 ft','12 ft','13 ft','18 ft'],a:2,st:'picture',hint:'The wall, ground, and ladder make a right triangle. The ladder is the longest side.',sol:['Use the Pythagorean theorem: 5² + h² = 13².','25 + h² = 169, so h² = 144.','h = 12 feet.']},
{id:'e9',band:3,q:'Sam drives 60 miles at 30 mph, then another 60 miles at 60 mph. What is his average speed for the whole trip?',ch:['40 mph','42 mph','45 mph','48 mph','50 mph'],a:0,st:'totals',hint:'Average speed = total distance ÷ total time. It is NOT just the average of 30 and 60.',sol:['First part: 60 ÷ 30 = 2 hours. Second part: 60 ÷ 60 = 1 hour.','Total: 120 miles in 3 hours.','120 ÷ 3 = 40 mph. (45 is the trap answer.)']},
{id:'e10',band:3,q:'An ant walks along grid lines from the bottom-left corner to a point 3 units right and 2 units up, moving only right or up. How many different paths can it take?',ch:['6','8','10','12','15'],a:2,st:'table',hint:'Every path is 5 moves long. Which 2 of the 5 moves are “up”?',sol:['Each path has 3 right moves (R) and 2 up moves (U), 5 moves in all.','A path is set once you choose which 2 of the 5 moves are U.','Choosing 2 of 5: (5 × 4) ÷ 2 = 10 paths.']},
{id:'e11',band:3,q:'The sum of five consecutive even integers is 320. What is the smallest of them?',ch:['56','58','60','62','64'],a:2,st:'totals',hint:'The middle number is the average.',sol:['The middle number is 320 ÷ 5 = 64.','The numbers are 60, 62, 64, 66, 68.','The smallest is 60.']},
{id:'e12',band:3,q:'In a club, the ratio of boys to girls is 3 : 5. There are 12 more girls than boys. How many members are in the club?',ch:['32','40','48','56','60'],a:2,st:'picture',hint:'Draw 3 boxes for boys and 5 for girls. How many boxes make the difference of 12?',sol:['Girls have 5 − 3 = 2 more boxes than boys, and 2 boxes = 12.','So 1 box = 6.','Total: 8 boxes × 6 = 48 members.']},
{id:'e13',band:3,q:'Two fair six-sided dice are rolled. What is the probability that the sum is 8?',ch:['1/9','5/36','1/6','7/36','2/9'],a:1,st:'list',hint:'List the pairs that add to 8. Remember (2, 6) and (6, 2) are different.',sol:['Pairs: (2,6), (3,5), (4,4), (5,3), (6,2). That is 5.','There are 6 × 6 = 36 equally likely outcomes.','Probability = 5/36.']},
{id:'e14',band:3,q:'Three lights blink every 4, 6, and 10 seconds. They all blink together right now. In how many seconds will they next blink together?',ch:['20','30','40','60','240'],a:3,st:'list',hint:'You need the smallest number that 4, 6, and 10 all divide into.',sol:['Multiples of 10: 10, 20, 30, 40, 50, 60…','Check which is also a multiple of 4 and 6: 60 is the first.','They blink together again after 60 seconds.']},
{id:'e15',band:3,q:'A circle has a circumference of 10π. What is its area?',ch:['10π','20π','25π','50π','100π'],a:2,st:'break',hint:'Use the circumference to find the radius first.',sol:['Circumference = 2πr = 10π, so r = 5.','Area = πr² = π × 5².','Area = 25π.']},
{id:'e16',band:3,q:'Which of these numbers is the largest?',ch:['2³⁰','3²⁰','4¹⁴','5¹²','6¹⁰'],a:1,st:'rewrite',hint:'Try to rewrite numbers with the same exponent, such as 10.',sol:['2³⁰ = (2³)¹⁰ = 8¹⁰ and 3²⁰ = (3²)¹⁰ = 9¹⁰, so 3²⁰ beats 2³⁰ and 6¹⁰.','4¹⁴ = 2²⁸, which is smaller than 2³⁰.','5¹² ≈ 244 million, while 9¹⁰ ≈ 3.5 billion. The largest is 3²⁰.']},
{id:'e17',band:3,q:'What is the smallest whole number greater than 1 that leaves a remainder of 1 when divided by 2, 3, 4, 5, and 6?',ch:['31','41','59','61','121'],a:3,st:'logic',hint:'If the number leaves remainder 1, what can you say about the number minus 1?',sol:['The number minus 1 must be divisible by 2, 3, 4, 5, and 6.','The smallest such positive number is 60.','So the answer is 60 + 1 = 61.']},
{id:'e18',band:3,q:'Jo is 3 times as old as Kai. In 10 years, Jo will be twice as old as Kai. How old is Kai now?',ch:['5','8','10','12','15'],a:2,st:'guess',hint:'Test the answer choices: try Kai = 10. How old is Jo, now and in 10 years?',sol:['Try Kai = 10, so Jo = 30.','In 10 years: Kai 20, Jo 40, and 40 is twice 20. ✓','With algebra: 3K + 10 = 2(K + 10), so K = 10.']},
{id:'e19',band:3,q:'How many perfect squares are between 100 and 200?',ch:['3','4','5','6','10'],a:1,st:'list',hint:'10² = 100. List the next few squares.',sol:['11² = 121, 12² = 144, 13² = 169, 14² = 196.','15² = 225 is too big, and 100 itself is not between 100 and 200.','There are 4.']},
{id:'e20',band:3,q:'After a 20% discount, a video game costs $36. What was the original price?',ch:['$28.80','$43.20','$45','$48','$56'],a:2,st:'backwards',hint:'After a 20% discount, you pay 80% of the original price.',sol:['$36 is 80% of the original price.','Original = 36 ÷ 0.8 = $45.','Check: 20% of $45 is $9, and $45 − $9 = $36. ($43.20 is the trap answer.)']},
{id:'e21',band:3,q:'One angle of an isosceles triangle is 40°. What is the sum of all the possible values of the triangle’s largest angle?',ch:['100°','140°','170°','180°','210°'],a:2,st:'list',hint:'The 40° angle could be the top angle, or it could be one of the two equal base angles.',sol:['Case 1: 40° is the top angle. Base angles are (180 − 40) ÷ 2 = 70° each. Largest: 70°.','Case 2: 40° is a base angle. Angles are 40°, 40°, 100°. Largest: 100°.','Sum: 70° + 100° = 170°.']},
{id:'e22',band:3,q:'How many diagonals does a 10-sided polygon have?',ch:['20','30','35','40','45'],a:2,st:'simpler',hint:'From each corner, how many other corners can you draw a diagonal to?',sol:['From each corner you can’t connect to itself or its 2 neighbors: 10 − 3 = 7 diagonals.','10 corners × 7 = 70, but each diagonal was counted from both ends.','70 ÷ 2 = 35.']},

/* Build 5 multiple-choice answers: the right one, sensible wrong ones, then nearby numbers to fill. */
function mc(ans,dis,fmt=String){
  const out=[ans],seen=new Set([fmt(ans)]);
  const ok=d=>d!==undefined&&d!==null&&!(typeof d==='number'&&(!isFinite(d)||d<0));
  for(const d of dis){if(out.length>=5)break;if(!ok(d))continue;const k=fmt(d);if(!seen.has(k)){seen.add(k);out.push(d)}}
  for(let step=1;out.length<5&&typeof ans==='number'&&step<500;step++)for(const d of [ans+step,ans-step]){if(out.length<5&&d>=0&&!seen.has(fmt(d))){seen.add(fmt(d));out.push(d)}}
  const arr=typeof ans==='number'?out.sort((x,y)=>x-y):shuffle(out);
  return {ch:arr.map(fmt),a:arr.indexOf(ans)};
}

{id:'g1b',band:1,like:['b2'],make(){const[A]=names(1),x=rnd(3,15),a=rnd(2,9),m=rnd(2,3),r=(x+a)*m,v=m===2?'doubled':'tripled';
  return {pts:4,st:'backwards',q:`${A} thought of a number. ${A} added ${a}, then ${v} the result, and got ${r}. What was the number?`,...mc(x,[r/m,r-a,x+a,r/m+a]),
    hint:`Start at ${r} and undo each step, last step first.`,sol:[`Undo the ${v}: ${r} ÷ ${m} = ${r/m}.`,`Undo adding ${a}: ${r/m} − ${a} = ${x}.`,`Check: ${x} + ${a} = ${x+a}, and ${x+a} × ${m} = ${r}.`]}}},
{id:'g1c',band:1,like:['b3'],make(){const g=pick([['have a dog','have a cat','children'],['play soccer','play piano','students'],['like apples','like bananas','kids']]),d=rnd(8,20),c=rnd(5,15),b=rnd(2,Math.min(d,c)-1),ans=d+c-b;
  return {pts:4,st:'venn',q:`In a group, ${d} ${g[2]} ${g[0]}, ${c} ${g[2]} ${g[1]}, and ${b} ${g[2]} do both. Everyone does at least one. How many ${g[2]} are in the group?`,...mc(ans,[d+c,d+c+b,d+c-2*b,ans+1]),
    hint:`The ${b} who do both are counted in the ${d} AND in the ${c}.`,sol:[`${d} + ${c} = ${d+c} counts the ${b} who do both twice.`,`Take away the double count: ${d+c} − ${b} = ${ans}.`,`There are ${ans} ${g[2]}.`]}}},
{id:'g1d',band:1,like:['b4'],make(){const an=pick([['chickens','pigs'],['ducks','goats'],['geese','sheep']]),h=rnd(5,12),p=rnd(1,h-1),L=2*h+2*p;
  return {pts:5,st:'guess',q:`A farm has only ${an[0]} and ${an[1]}. Together they have ${h} heads and ${L} legs. How many ${an[1]} are there?`,...mc(p,[h-p,p+1,p-1,Math.floor(L/4)]),
    hint:`Pretend all ${h} animals are ${an[0]}. How many legs would that be?`,sol:[`If all ${h} were ${an[0]}: ${h} × 2 = ${2*h} legs.`,`We need ${L} legs, which is ${L-2*h} more.`,`Each of the ${an[1]} has 2 extra legs, so ${L-2*h} ÷ 2 = ${p} ${an[1]}.`,`Check: ${p} × 4 + ${h-p} × 2 = ${4*p} + ${2*(h-p)} = ${L}.`]}}},
{id:'g1e',band:1,like:['b5'],make(){const N=rnd(20,59),d=rnd(1,5);let ones=[],tens=[],pages=0;
  for(let i=1;i<=N;i++){if(i%10===d)ones.push(i);if(Math.floor(i/10)===d)tens.push(i);if(String(i).includes(d))pages++}
  const ans=ones.length+tens.length;
  return {pts:4,st:'list',q:`The pages of a book are numbered from 1 to ${N}. How many times is the digit ${d} printed?`,...mc(ans,[pages,ones.length,ans+1,ans-1,ans+2]),
    hint:`Count the ${d}s in the ones place, then the ${d}s in the tens place.`,sol:[`Ones place: ${ones.join(', ')}. That is ${ones.length} times.`,tens.length?`Tens place: ${tens[0]} to ${tens[tens.length-1]}. That is ${tens.length} times.`:`No page up to ${N} has a ${d} in the tens place.`,`Total: ${ones.length} + ${tens.length} = ${ans}.`]}}},
{id:'g1f',band:1,like:['b6'],make(){const h=rnd(1,10),mm=pick([30,35,40,45,50,55]);let m;do{m=rnd(3,11)*5}while(mm+m<60||mm+m>=120);
  const em=mm+m-60,ans=`${h+1}:${pad(em)}`,ev=pick(['A movie','A game','A party','Swim class']);
  return {pts:3,st:'break',q:`It is ${h}:${pad(mm)} now. ${ev} starts in ${m} minutes. At what time does it start?`,...mc(ans,[`${h}:${mm+m}`,`${h+1}:${pad((em+10)%60)}`,`${h+2}:${pad(em)}`,`${h}:${pad(em)}`,`${h+1}:${pad((em+50)%60)}`]),
    hint:`How many minutes until ${h+1}:00? Then add the rest.`,sol:[`From ${h}:${pad(mm)} to ${h+1}:00 is ${60-mm} minutes.`,`${m} − ${60-mm} = ${em} minutes still to go.`,`${h+1}:00 plus ${em} minutes is ${ans}.`]}}},
{id:'g1g',band:1,like:['b9'],make(){const it=pick(['pencils','stickers','erasers','markers']),k=rnd(2,5),c=rnd(1,3),n=k*rnd(3,6),ans=n/k*c;
  return {pts:3,st:'table',q:`${it[0].toUpperCase()+it.slice(1)} are sold at ${k} for $${c}. How much do ${n} ${it} cost?`,...mc(ans,[n,n*c,n/k,ans+c,ans-c],money),
    hint:`Make a table: ${k} ${it} cost $${c}, ${2*k} ${it} cost…?`,sol:[`${Array.from({length:n/k},(_,i)=>`${k*(i+1)} → $${c*(i+1)}`).join(', ')}.`,`Or: ${n} ÷ ${k} = ${n/k} groups, at $${c} each.`,`${n} ${it} cost ${money(ans)}.`]}}},
{id:'g1h',band:1,make(){const a=rnd(4,15),b=rnd(2,a-1),ans=2*(a+b);
  return {pts:3,st:'picture',q:`A rectangle is ${a} cm long and ${b} cm wide. What is its perimeter?`,figSVG:rectSVG(a,b,'cm'),...mc(ans,[a+b,a*b,2*a+b,a+2*b,ans+2],v=>v+' cm'),
    hint:'Perimeter is the distance all the way around. A rectangle has 4 sides.',sol:[`The four sides are ${a}, ${b}, ${a}, and ${b} cm.`,`${a} + ${b} + ${a} + ${b} = ${ans}.`,`The perimeter is ${ans} cm.`]}}},
{id:'g1i',band:1,make(){const[A]=names(1),f=rnd(2,6),k=rnd(2,6),r=rnd(1,9),ans=k*f+r;
  return {pts:4,st:'backwards',q:`${A} gave ${k} stickers to each of ${f} friends and had ${r} stickers left. How many stickers did ${A} have at the start?`,...mc(ans,[k*f,k+f+r,k*f-r,ans+k,(k+r)*f]),
    hint:'Find how many stickers were given away, then add back the ones left.',sol:[`Given away: ${k} × ${f} = ${k*f} stickers.`,`Add the ${r} left: ${k*f} + ${r} = ${ans}.`,`${A} started with ${ans} stickers.`]}}},
{id:'g1j',band:1,like:['b7'],make(){const ns=names(3),[fish,bird,dog]=shuffle([...ns]);const ch=[...ns,'Nobody','We can’t tell'];
  return {pts:5,st:'logic',q:`${ns[0]}, ${ns[1]}, and ${ns[2]} each have one pet: a fish, a bird, or a dog. They all have different pets. ${bird}’s pet can’t swim and isn’t a dog. ${dog}’s pet barks. Who has the fish?`,ch,a:ch.indexOf(fish),
    hint:`Figure out ${bird}’s pet and ${dog}’s pet first.`,sol:[`${bird}’s pet can’t swim (not the fish) and isn’t the dog, so ${bird} has the bird.`,`${dog}’s pet barks, so ${dog} has the dog.`,`The fish is the only pet left, so ${fish} has it.`]}}},
/* ===== Grades 4–5 ===== */
{id:'g2a',band:2,like:['c1'],make(){const k=pick([3,5]),step=pick([1,2]),m=rnd(12,60)*(step===2?2:1)/(step===2?1:1),S=k*m,big=Math.random()<.5,ans=big?m+step*(k-1)/2:m-step*(k-1)/2,list=Array.from({length:k},(_,i)=>m+step*(i-(k-1)/2));
  const kind=step===2?(m%2?'consecutive odd':'consecutive even'):'consecutive whole';
  return {pts:3,st:'totals',q:`The sum of ${k} ${kind} numbers is ${S}. What is the ${big?'largest':'smallest'} of them?`,...mc(ans,[m,big?ans+step:ans-step,big?ans-step*(k-1):ans+step*(k-1),S/(k+1)|0]),
    hint:'The middle number is the average of the numbers.',sol:[`The middle number is ${S} ÷ ${k} = ${m}.`,`The numbers are ${list.join(', ')}.`,`The ${big?'largest':'smallest'} is ${ans}.`]}}},
{id:'g2b',band:2,like:['c2'],make(){const s=rnd(3,9),list=Array.from({length:s},(_,i)=>`${i+1}${s-i-1}`);
  return {pts:3,st:'list',q:`How many two-digit numbers have digits that add up to ${s}?`,...mc(s,[s-1,s+1,s+2,10]),
    hint:'Start with tens digit 1 and go up. A number can’t start with 0.',sol:[`In order: ${list.join(', ')}.`,`A tens digit bigger than ${s} is already too big.`,`There are ${s} numbers.`]}}},
{id:'g2c',band:2,like:['c3'],make(){const n=rnd(4,10),ans=n*(n-1)/2;
  return {pts:4,st:'simpler',q:`${n} friends meet, and each friend shakes hands exactly once with every other friend. How many handshakes are there?`,...mc(ans,[n*(n-1),n*n,ans+n,(n-1)*(n-1)]),
    hint:'Try 2, 3, and 4 friends first and watch how the count grows.',sol:[`The first friend shakes ${n-1} hands, the next shakes ${n-2} new hands, and so on.`,`${Array.from({length:n-1},(_,i)=>n-1-i).join(' + ')} = ${ans}.`,`Or: ${n} × ${n-1} = ${n*(n-1)} counts each handshake twice, so ${n*(n-1)} ÷ 2 = ${ans}.`]}}},
{id:'g2d',band:2,like:['c4'],make(){const w=rnd(2,9),r=rnd(2,4),l=r*w,P=2*(w+l),ans=w*l,t=['','','twice','three times','four times'][r];
  return {pts:4,st:'picture',q:`A rectangle has a perimeter of ${P} cm. Its length is ${t} its width. What is its area?`,...mc(ans,[P,w*w,l*l,w*(l+1),ans+w],v=>v+' cm²'),
    hint:'Draw it. If the width is 1 part, how many parts go all the way around?',sol:[`Width = 1 part, length = ${r} parts. Around: 1 + ${r} + 1 + ${r} = ${2*(r+1)} parts.`,`${2*(r+1)} parts = ${P} cm, so 1 part = ${w} cm.`,`Width ${w} cm, length ${l} cm, area ${w} × ${l} = ${ans} cm².`]}}},
{id:'g2e',band:2,like:['c5'],make(){const[A]=names(1),e=rnd(3,15),s=rnd(2,10),it=pick(['a book','a toy','a shirt','a game']),sn=pick(['a snack','a drink','a pen']),ans=2*(e+s);
  return {pts:4,st:'backwards',q:`${A} spent half of their money on ${it}. Then ${A} spent $${s} on ${sn} and had $${e} left. How much money did ${A} start with?`,...mc(ans,[2*e+s,e+s,ans+s,2*e,ans-2],money),
    hint:`Start with the $${e} left at the end and undo each step.`,sol:[`Before ${sn}: $${e} + $${s} = $${e+s}.`,`That was the half not spent on ${it}.`,`Start: $${e+s} × 2 = $${ans}.`]}}},
{id:'g2f',band:2,like:['c6'],make(){const x=rnd(2,9),y=rnd(x+1,15),P=x*y,S=x+y,ans=y-x,pairs=[];for(let i=1;i*i<=P;i++)if(P%i===0)pairs.push(`${i} × ${P/i}`);
  return {pts:4,st:'list',q:`Two whole numbers multiply to ${P} and add up to ${S}. What is the difference between them?`,...mc(ans,[x,y,ans+2,ans-1,S-1]),
    hint:`List all the pairs of numbers that multiply to ${P}.`,sol:[`Pairs: ${pairs.join(', ')}.`,`Only ${x} + ${y} = ${S}.`,`The difference is ${y} − ${x} = ${ans}.`]}}},
{id:'g2g',band:2,like:['c7'],make(){const w=pick(['ELEPHANT','DINOSAUR','RAINBOW','TRIANGLE','PENGUIN','MONSTER','PUMPKIN','BUTTERFLY']),L=w.length,n=rnd(30,99),q0=Math.floor((n-1)/L),idx=(n-1)%L,ans=w[idx];
  const others=shuffle([...new Set(w)].filter(c=>c!==ans)).slice(0,4),ch=shuffle([ans,...others]);
  return {pts:5,st:'pattern',q:`The word ${w} is written over and over: ${w}${w}${w}… What is the ${ord(n)} letter?`,ch,a:ch.indexOf(ans),
    hint:`${w} has ${L} letters. Where does each repeat end?`,sol:[`Each ${w} uses ${L} letters, so every multiple of ${L} ends a word.`,q0?`Letter ${q0*L} (${q0} × ${L}) is the last letter of a full word.`:`The first word ends at letter ${L}.`,`Letter ${n} is ${idx+1} more, the ${ord(idx+1)} letter of ${w}: ${ans}.`]}}},
{id:'g2h',band:2,like:['c8'],make(){const h1=rnd(6,8),m1=rnd(1,11)*5,h2=h1+rnd(2,3),m2=rnd(0,11)*5,ans=(h2*60+m2)-(h1*60+m1);
  return {pts:3,st:'break',q:`How many minutes are there from ${h1}:${pad(m1)} a.m. to ${h2}:${pad(m2)} a.m. on the same morning?`,...mc(ans,[ans+10,ans-10,ans+20,(h2-h1)*100+m2-m1]),
    hint:`Get to an easy time first, like ${h1+1}:00.`,sol:[`${h1}:${pad(m1)} to ${h1+1}:00 is ${60-m1} minutes.`,`${h1+1}:00 to ${h2}:00 is ${h2-h1-1} ${plural(h2-h1-1,'hour','hours')} = ${(h2-h1-1)*60} minutes.`,`${h2}:00 to ${h2}:${pad(m2)} is ${m2} minutes. Total: ${60-m1} + ${(h2-h1-1)*60} + ${m2} = ${ans}.`]}}},
{id:'g2i',band:2,make(){const a=rnd(2,4),b=rnd(2,4),k=rnd(2,5),N=a*b*k,red=N/a,R=N-red,blue=R/b,ans=R-blue,F=['','','Half','One third','One quarter'];
  return {pts:4,st:'break',q:`A bag has ${N} marbles. ${F[a]} of them are red. ${F[b]} of the remaining marbles are blue. The rest are green. How many marbles are green?`,...mc(ans,[R,blue,N-N/a-N/b,ans+b,red]),
    hint:'Work in steps: first find the red marbles, then look only at what is left.',sol:[`Red: ${F[a].toLowerCase()} of ${N} = ${red}. Remaining: ${N} − ${red} = ${R}.`,`Blue: ${F[b].toLowerCase()} of ${R} = ${blue}.`,`Green: ${R} − ${blue} = ${ans}.`]}}},
{id:'g2j',band:2,make(){const[A]=names(1),X=pick([80,84,85,88,90]);let s,need;do{s=[rnd(X-12,X+10),rnd(X-12,X+10),rnd(X-12,X+10)];need=4*X-s[0]-s[1]-s[2]}while(need<60||need>100);
  const sum=s[0]+s[1]+s[2];
  return {pts:5,st:'totals',q:`${A} scored ${s[0]}, ${s[1]}, and ${s[2]} on three tests. What score does ${A} need on the fourth test to average exactly ${X}?`,...mc(need,[X,need+4,need-4,Math.round(sum/3)]),
    hint:'Turn the average into a total: what must all four scores add up to?',sol:[`Four tests averaging ${X} add up to 4 × ${X} = ${4*X}.`,`The first three add up to ${s[0]} + ${s[1]} + ${s[2]} = ${sum}.`,`Needed: ${4*X} − ${sum} = ${need}.`]}}},
/* ===== Grades 6–8 ===== */
{id:'g3a',band:3,like:['d1'],make(){const b=pick([2,3]),m=pick([5,7,11,13]),e=rnd(15,60),seq=[];let r=b%m;do{seq.push(r);r=r*b%m}while(r!==seq[0]);
  const L=seq.length,pos=((e-1)%L)+1,ans=seq[pos-1];
  return {st:'pattern',q:`What is the remainder when ${b}${sup(e)} is divided by ${m}?`,...mc(ans,[...shuffle(seq.filter(v=>v!==ans)),0,b]),
    hint:`Find the remainders of ${b}¹, ${b}², ${b}³… when divided by ${m}. Do they repeat?`,sol:[`Remainders: ${seq.map((v,i)=>`${b}${sup(i+1)} → ${v}`).join(', ')}, then the pattern repeats.`,`The cycle has length ${L}. ${e} = ${L} × ${Math.floor((e-1)/L)} + ${pos}, so ${b}${sup(e)} is in the same spot as ${b}${sup(pos)}.`,`The remainder is ${ans}.`]}}},
{id:'g3b',band:3,like:['e6'],make(){const b=pick([2,3,4,7,8,9]),e=rnd(20,99),seq=[];let r=b%10;do{seq.push(r);r=r*b%10}while(r!==seq[0]);
  const L=seq.length,pos=((e-1)%L)+1,ans=seq[pos-1];
  return {st:'pattern',q:`What is the units digit of ${b}${sup(e)}?`,...mc(ans,[...seq.filter(v=>v!==ans),b,(ans+5)%10,0]),
    hint:`Write the units digits of ${b}¹, ${b}², ${b}³… and look for a repeat.`,sol:[`Units digits: ${seq.join(', ')}, then they repeat.`,`The cycle has length ${L}. Position ${e} matches position ${pos} in the cycle.`,`So ${b}${sup(e)} ends in ${ans}.`]}}},
{id:'g3c',band:3,like:['d2'],make(){const[a,b]=pick([[2,3],[3,5],[2,5],[4,6],[3,4],[5,7],[2,7],[4,10],[6,9]]),l=lcm(a,b),N=rnd(50,150),ca=Math.floor((N-1)/a),cb=Math.floor((N-1)/b),cl=Math.floor((N-1)/l),ans=ca+cb-cl;
  return {st:'venn',q:`How many positive integers less than ${N} are divisible by ${a} or ${b}?`,...mc(ans,[ca+cb,ans+1,ans-1,ca+cb-2*cl]),
    hint:`Count multiples of ${a} and of ${b}. Which numbers did you count twice?`,sol:[`Multiples of ${a} below ${N}: ${ca}. Multiples of ${b}: ${cb}.`,`Numbers divisible by both are multiples of ${l}: ${cl}. They were counted twice.`,`${ca} + ${cb} − ${cl} = ${ans}.`]}}},
{id:'g3d',band:3,like:['d3'],make(){let n,B,r,tot;do{n=rnd(4,7);B=rnd(10,30);r=rnd(1,60);tot=(n-1)*B+r}while(tot%n||r===tot/n);const A=tot/n;
  return {st:'totals',q:`The average of ${n} numbers is ${A}. After one number is removed, the average of the remaining ${n-1} numbers is ${B}. What number was removed?`,...mc(r,[A,B,Math.abs(A-B),A+B,r+n]),
    hint:'Turn each average into a total.',sol:[`${n} numbers averaging ${A} total ${n} × ${A} = ${tot}.`,`${n-1} numbers averaging ${B} total ${n-1} × ${B} = ${(n-1)*B}.`,`The removed number is ${tot} − ${(n-1)*B} = ${r}.`]}}},
{id:'g3e',band:3,like:['d4'],make(){const[up,dn,res]=pick([[25,20,'The same'],[50,50,'25% less'],[20,20,'4% less'],[10,10,'1% less'],[100,50,'The same'],[50,20,'20% more'],[20,25,'10% less'],[40,25,'5% more'],[30,30,'9% less'],[60,25,'20% more']]),it=pick(['a jacket','a bike','a lamp','a backpack']);
  const mid=100+up,fin=mid*(100-dn)/100,d=up-dn;
  return {st:'nice',q:`A store raises the price of ${it} by ${up}%. Later it lowers the new price by ${dn}%. How does the final price compare with the original price?`,...mc(res,[d===0?'The same':d>0?`${d}% more`:`${-d}% less`,`${up}% more`,`${dn}% less`,'The same',`${up+dn}% more`,'2% less','3% more']),
    hint:'Pretend the price started at $100.',sol:[`Start at $100. Up ${up}%: $${mid}.`,`Down ${dn}% of $${mid} is $${mid*dn/100}: $${mid} − $${mid*dn/100} = $${fin}.`,`From $100 to $${fin}: ${res.toLowerCase()}${res==='The same'?' as the original':' than the original'}.`]}}},
{id:'g3f',band:3,like:['d5'],make(){const w=pick(['BOOK','DEED','TOOTH','APPLE','BANANA','PEPPER','LETTER','COOKIE','PAPAYA']),n=w.length,cnt={};for(const c of w)cnt[c]=(cnt[c]||0)+1;
  const reps=Object.entries(cnt).filter(([,v])=>v>1),den=reps.reduce((p,[,v])=>p*fact(v),1),ans=fact(n)/den;
  return {st:'list',q:`In how many different ways can the letters of ${w} be arranged in a row?`,...mc(ans,[fact(n),fact(n)/2,ans*2,n*(n-1),ans/2]),
    hint:'Count as if every letter were different, then fix the double counting from repeated letters.',sol:[`If all ${n} letters were different: ${n}! = ${fact(n)}.`,`Repeated letters: ${reps.map(([c,v])=>`${c} appears ${v} times (divide by ${v}! = ${fact(v)})`).join('; ')}.`,`${fact(n)} ÷ ${den} = ${ans}.`]}}},
{id:'g3g',band:3,like:['d6'],make(){const k=rnd(2,6),a=3*k,b=4*k,c=5*k,ans=12*k/5;
  return {st:'twoways',q:`A right triangle has legs of length ${a} and ${b}. What is the length of the altitude drawn to the hypotenuse?`,figSVG:triSVG(a,b),...mc(ans,[a,c/2,ans+1.2,(a+b)/2,ans-1.2],v=>String(Math.round(v*10)/10)),
    hint:'Find the hypotenuse, then compute the area in two different ways.',sol:[`Hypotenuse: √(${a}² + ${b}²) = √${c*c} = ${c}.`,`Area using the legs: ½ × ${a} × ${b} = ${a*b/2}.`,`Area using the hypotenuse: ½ × ${c} × h = ${a*b/2}, so h = ${a*b} ÷ ${c} = ${Math.round(ans*10)/10}.`]}}},
{id:'g3h',band:3,like:['d7'],make(){const n=rnd(20,100),ans=n*(n+1)/2;
  return {st:'pairing',q:`What is the value of 1 + 2 + 3 + … + ${n-1} + ${n}?`,...mc(ans,[n*(n-1)/2,n*(n+1),ans+n,Math.floor(n*n/2)]),
    hint:'Pair the first number with the last, the second with the second-to-last, and so on.',sol:[`1 + ${n} = ${n+1}, 2 + ${n-1} = ${n+1}, and so on.`,n%2===0?`${n} numbers make ${n/2} pairs.`:`${n} numbers make ${(n-1)/2} pairs plus the middle number ${(n+1)/2}.`,`Total: ${n} × ${n+1} ÷ 2 = ${ans}.`]}}},
{id:'g3i',band:3,like:['d8'],make(){if(Math.random()<.6){const n=rnd(2,5),t=2**n;
    return {st:'complement',q:`A fair coin is flipped ${n} times. What is the probability of getting at least one head?`,...mc(`${t-1}/${t}`,[`1/${t}`,`${n}/${t}`,'1/2',`${t-2}/${t}`,`${n}/${n+1}`]),
      hint:'What is the only way to get NO heads at all?',sol:[`There are 2${sup(n)} = ${t} equally likely outcomes.`,`Only one has no heads: all tails.`,`So ${t} − 1 = ${t-1} outcomes have a head: ${t-1}/${t}.`]}}
  return {st:'complement',q:'Two fair six-sided dice are rolled. What is the probability that at least one of them shows a 6?',...mc('11/36',['1/6','1/3','1/36','25/36','5/18']),
    hint:'Count the outcomes with NO sixes first.',sol:['There are 6 × 6 = 36 outcomes.','No sixes: 5 × 5 = 25 outcomes.','At least one six: 36 − 25 = 11, so 11/36.']}}},
{id:'g3j',band:3,like:['d9'],make(){let v1,v2,t,D;do{v1=rnd(8,18)*5;v2=rnd(8,18)*5;t=pick([1.5,2,2.5,3,4]);D=(v1+v2)*t}while(!Number.isInteger(D));

{id:'g3n',band:3,like:['e12'],make(){const[p,q]=pick([[2,3],[3,5],[3,4],[4,7],[2,5],[5,8]]),k=rnd(3,9),D=(q-p)*k,ans=(p+q)*k,g=pick([['boys','girls','students in a class'],['cats','dogs','pets at a shelter'],['red cars','blue cars','cars in a lot']]);

{id:'g3o',band:3,like:['e5'],make(){const n=pick([24,36,48,60,72,84,90,96,100,120,144,180]),pairs=[];for(let i=1;i*i<=n;i++)if(n%i===0)pairs.push([i,n/i]);const ans=pairs.reduce((s,[x,y])=>s+(x===y?1:2),0);

{id:'g3q',band:3,like:['e22'],make(){const n=rnd(5,15),nm={5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',10:'decagon',12:'dodecagon'}[n],ans=n*(n-3)/2;

const WP_BAND=g=>g<=1?0:g<=3?1:g<=5?2:3;
const BAND_LABEL=['grades K–1','grades 2–3','grades 4–5','grades 6–8'];
const stratLine=p=>{const t=STRAT[p.st]||DIV[p.st];return t?`<p class="strat"><strong>${t.icon} ${STRAT[p.st]?'Strategy':'Trick'}: ${t.name}.</strong> ${t.tip}</p>`:''};
function pickWord(){
  const band=WP_BAND(eg()),pool=WP.filter(p=>p.band===band);
  if(!Array.isArray(S.seen))S.seen=[];
  const fresh=pool.filter(p=>!S.seen.includes(p.id)&&!G.used.includes(p.id));
  const gens=GEN.filter(t=>t.band===band&&!G.used.includes(t.id));
  // Hand-written problems first get mixed in; once they've all been seen, every problem is freshly generated.
  if(fresh.length&&(!gens.length||Math.random()<.4)){const p=pick(fresh);G.used.push(p.id,...GEN.filter(t=>(t.like||[]).includes(p.id)).map(t=>t.id));S.seen.push(p.id);save();return p}
  const t=pick(gens.length?gens:GEN.filter(t=>t.band===band));G.used.push(t.id,...(t.like||[]));
  return Object.assign({id:t.id,band},t.make());
}
function renderWord(p=pickWord()){
  G.p=p;boxes=[];G.qStart=Date.now();
  const host=$('#problem');
  host.innerHTML=`<div class="wp">
    <span class="wp-tag">${p.tag||(p.band<3?`⭐ Elementary contest style, ${p.pts} points`:'🏆 Middle school contest style')}</span>
    <p class="wp-q${/^[\d,]+ ÷ [\d,]+$/.test(p.q)?' big':''}">${p.q}</p>
    ${p.figSVG||p.fig?`<div class="wp-fig">${p.figSVG||FIG[p.fig]()}</div>`:''}
    <div class="choices">${p.ch.map((c,i)=>`<button class="choice" data-i="${i}"><span class="letter">${'ABCDE'[i]}</span><span>${c}</span></button>`).join('')}</div>
    <div class="wp-tools"><button class="btn ghost" id="sayBtn" aria-label="Read the problem aloud">🔊</button><button class="btn ghost" id="hintBtn">💡 Hint</button><button class="btn ghost" id="solBtn">Show solution</button></div>
  </div>`;
  host.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));
  $('#hintBtn').onclick=()=>{if(G.busy||G.paused)return;G.hinted=true;tutorBox('💡 Hint',`<p>${p.hint}</p>${stratLine(p)}`)};
  $('#solBtn').onclick=()=>{if(G.busy||G.paused)return;G.streak=0;showStreak();revealWord()};
  $('#sayBtn').onclick=()=>speakProblem(p);
  if(G.mode==='daily'){const t=document.querySelector('.wp-tag');if(t)t.textContent='📅 Daily Challenge, '+t.textContent.replace(/^\S+\s/,'')}
  if(p.band===0&&S.settings.readAloud)speakProblem(p);
}
function lockChoices(){document.querySelectorAll('.choice,#hintBtn,#solBtn').forEach(b=>b.disabled=true)}
const solList=p=>`<ol>${p.sol.map(x=>`<li>${x}</li>`).join('')}</ol>`;
function choose(i){
  if(!G||G.busy||G.paused)return;const p=G.p,btn=$(`.choice[data-i="${i}"]`);
  if(i===p.a){
    G.busy=true;btn.classList.add('right');G.correct++;G.coins+=1;
    if(G.attempt===0){G.first++;G.streak++;G.xp+=(G.hinted?7:12)+(G.streak>=3?5:0);G.res[G.i]='great';rec(stratKey(p),true);adaptAfter(true);if(G.mode==='review')removeMistake(p)}else{G.xp+=5;G.res[G.i]='ok'}
    S.bestStreak=Math.max(S.bestStreak,G.streak);
    cheer();showStreak();renderTrack();lockChoices();
    tutorBox(G.mode==='div'?(()=>{const t=Math.max(1,Math.round((Date.now()-G.qStart)/1000));return `Correct! ⏱ ${t} ${plural(t,'second','seconds')}`})():'Correct!',`${stratLine(p)}<details><summary>See the full solution</summary>${solList(p)}</details>`,'Next problem');
    return;
  }
  btn.classList.add('wrong');btn.disabled=true;G.streak=0;showStreak();oops();if(G.attempt===0){rec(stratKey(p),false);adaptAfter(false)}G.attempt++;
  if(G.attempt===1)tutorBox('Not quite. Here’s a hint.',`<p>${p.hint}</p>${stratLine(p)}`);
  else revealWord();
}
function revealWord(){
  const p=G.p;G.busy=true;if(G.attempt===0)rec(stratKey(p),false);addMistake(p);if(!G.res[G.i])G.res[G.i]='miss';renderTrack();lockChoices();
  $(`.choice[data-i="${p.a}"]`).classList.add('right');
  tutorBox('Here’s how to solve it',`${solList(p)}<p class="ans">Answer: ${'ABCDE'[p.a]}) ${p.ch[p.a]}</p>${stratLine(p)}`,'Next problem');
}

const OBJS=[['🍎','apples'],['⭐','stars'],['🐟','fish'],['🍓','strawberries'],['🎈','balloons'],['🐥','chicks'],['🌼','flowers'],['🍪','cookies']];
function cvGroup(e,n,gone=0){return `<div class="cv-group" style="grid-template-columns:repeat(${Math.max(1,Math.min(n,5))},auto)">${Array.from({length:n},(_,i)=>`<span class="cv-obj${i>=n-gone?' gone':''}"><i>${e}</i></span>`).join('')}</div>`}
function cvHTML(e,parts,label,caption=''){const total=parts.reduce((t,x)=>t+(typeof x==='string'?0:x.n),0);
  return `<div class="cv${total>10?' small':''}" role="img" aria-label="${label}">${parts.map(x=>typeof x==='string'?`<span class="cv-op">${x}</span>`:cvGroup(e,x.n,x.gone)).join('')}${caption?`<span class="cv-cap">${caption}</span>`:''}</div>`}
function countPicture(p){const[e,nm]=pick(OBJS);
  if(p.type==='add')return cvHTML(e,[{n:p.a},'+',{n:p.b}],`${p.a} ${nm} plus ${p.b} ${nm}`);
  return cvHTML(e,[{n:p.a,gone:p.b}],`${p.a} ${nm}, take away ${p.b}`,`${p.a} take away ${p.b}`)}
/* ---------- Answer boxes ---------- */
let boxes=[],active=0,G=null;
const inkColor=()=>getComputedStyle(document.body).color;
function sizeCanvas(b){const r=b.cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,3);
  b.cv.width=Math.round(r.width*dpr);b.cv.height=Math.round(r.height*dpr);
  const c=b.cv.getContext('2d');c.lineCap='round';c.lineJoin='round';c.lineWidth=b.cv.width*.085;c.strokeStyle=c.fillStyle=inkColor();b.ctx=c;b.sized=true}
function makeBox(){
  const el=document.createElement('div');el.className='box';el.innerHTML='<canvas aria-hidden="true"></canvas><span class="dg"></span>';
  el.setAttribute('role','button');el.setAttribute('aria-label','Answer digit');el.tabIndex=0;
  const b={el,cv:el.querySelector('canvas'),dg:el.querySelector('.dg'),val:null,timer:null};
  el.addEventListener('pointerdown',()=>setActive(boxes.indexOf(b)));
  el.addEventListener('focus',()=>setActive(boxes.indexOf(b)));
  let drawing=false,last=null;
  const pt=e=>{const r=b.cv.getBoundingClientRect();return[(e.clientX-r.left)*b.cv.width/r.width,(e.clientY-r.top)*b.cv.height/r.height]};
  b.cv.addEventListener('pointerdown',e=>{
    if(S.keypad||!G||G.busy||G.paused)return;e.preventDefault();
    try{b.cv.setPointerCapture(e.pointerId)}catch(_){}
    if(!b.sized)sizeCanvas(b);
    if(b.val!==null)setVal(b,null);
    clearTimeout(b.timer);drawing=true;last=pt(e);
    b.ctx.beginPath();b.ctx.arc(last[0],last[1],b.ctx.lineWidth/2,0,Math.PI*2);b.ctx.fill();
  });
  b.cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);b.ctx.beginPath();b.ctx.moveTo(last[0],last[1]);b.ctx.lineTo(p[0],p[1]);b.ctx.stroke();last=p});
  const up=()=>{if(!drawing)return;drawing=false;b.timer=setTimeout(()=>{
    const r=recognize(b.cv);b.ctx.clearRect(0,0,b.cv.width,b.cv.height);
    if(r!==null){setVal(b,r);goNext();checkFull()}},750)};
  b.cv.addEventListener('pointerup',up);b.cv.addEventListener('pointercancel',up);
  return b;
}
function setVal(b,v){b.val=v;b.dg.textContent=v===null?'':v;b.el.classList.toggle('filled',v!==null);b.el.classList.remove('wrong','right');if(v===null&&G)clearTimeout(G.checkT)}
function setActive(i){if(i<0)return;active=i;boxes.forEach((b,k)=>b.el.classList.toggle('active',k===i))}
function order(){const idx=boxes.map((_,i)=>i);return G.p.dir==='rtl'?idx.reverse():idx}
function goNext(){const nx=order().find(i=>boxes[i].val===null);setActive(nx===undefined?active:nx)}
function checkFull(){clearTimeout(G.checkT);if(boxes.length&&boxes.every(b=>b.val!==null))G.checkT=setTimeout(check,S.keypad?350:900)}
function keyPress(k){
  if(!G||G.busy||G.paused||!boxes.length)return;
  if(k==='del'){const b=boxes[active];if(b.val!==null){setVal(b,null)}else{const o=order(),pos=o.indexOf(active);if(pos>0){setActive(o[pos-1]);setVal(boxes[o[pos-1]],null)}}return}
  setVal(boxes[active],Number(k));goNext();checkFull();
}
document.addEventListener('keydown',e=>{if(!G||!$('#problem'))return;if(/^[0-9]$/.test(e.key))keyPress(e.key);else if(e.key==='Backspace')keyPress('del')});

}
function wireNav(active){
  const go={play:()=>{if(active==='play'){sfx('tap');const aw=S.advLast&&WD[S.advLast]&&worldOK(S.advLast)?S.advLast:'forest';advMap(aw,advNext(aw))}else home()},shop:()=>{if(active!=='shop')shop()},guide:()=>{if(active!=='guide')guide()},parents:()=>{if(active!=='parents')parentGate()}};
  [['play','playTab'],['shop','shopBtn'],['guide','guideBtn'],['parents','parentBtn']].forEach(([k,id])=>{const b=$('#'+id);if(b)b.onclick=go[k]});
}
function addNav(active){const a=$('#app');if(!a||a.querySelector('.tabbar'))return;a.insertAdjacentHTML('beforeend',navHTML(active));wireNav(active)}

function diagnoseP(P,u){

    if(rev)return 'You have the right digits, but they’re in reverse order. Write the ones digit on the right.';
    if(noCarryAdd(P.a,P.b)!==P.a+P.b&&u===noCarryAdd(P.a,P.b)){const A=digitsR(P.a),B=digitsR(P.b);let i=0,c=0;for(;i<10;i++){if((A[i]||0)+(B[i]||0)+c>=10)break}

  }
  if(P.kind==='sub'){
    if(u===P.a+P.b)return 'Look at the sign. It’s a minus, so we take away. Try subtracting.';
    if(rev)return 'You have the right digits, but they’re in reverse order. Write the ones digit on the right.';
    if(noBorrowSub(P.a,P.b)!==P.a-P.b&&u===noBorrowSub(P.a,P.b)){const A=digitsR(P.a),B=digitsR(P.b);let i=0;while(i<A.length&&A[i]>=(B[i]||0))i++;

  if(P.kind==='missing'){
    if(P.form==='add'&&u===P.a+P.c)return `Adding made it too big. We want the part that goes with ${fN(P.a)} to make ${fN(P.c)}.`;

    if(P.form==='sub'&&u===P.c-P.b)return `If you take ${fN(P.b)} away from the mystery number and get ${fN(P.c)}, the mystery number must be BIGGER than ${fN(P.c)}.`;

  if(P.kind==='skip'&&u===P.last+1)return 'The numbers don’t grow by 1. Look at how big each jump is.';
  if(P.kind==='pv'&&P.digit!==undefined&&u===P.digit&&P.p)return `That’s the digit, but what is it worth? The ${P.digit} is in the ${PLACE[P.p]} place.`;

    if(!P.add&&u===P.a+P.b)return 'Adding made it bigger, but in this story we need what’s left or the difference. Try subtracting.';
  }
  if(off===1)return 'So close! You’re just 1 away. Check carefully.';
  if(off<=Math.max(2,P.ans*.05))return 'Close! Check your work carefully.';
  return null;

function lvlKey(k){

function dailyStreak(){const D=S.daily,t=dkey(),y=dkey(new Date(Date.now()-864e5));return D.last===t||D.last===y?D.streak:0}
/* ---------- Pet shop ---------- */
function shop(){
  if(G)cleanup();G=null;
  const eq=S.shop.eq;
  const card=(id,it)=>{const owned=S.shop.owned.includes(id),on=eq[it.slot]===id,prev={...eq,[it.slot]:id};
    const art=it.slot==='bg'?`<div class="pet shop-art bg-${id}">${petSVG('happy',stage(),S.pet,{...eq,bg:id})}</div>`:`<div class="shop-art">${petSVG('happy',stage(),S.pet,prev)}</div>`;
    const lock=it.boss&&!owned,bb=it.boss?BOSSES.find(b=>b.reward===id):null;
    return `<button class="shop-item${on?' on':''}${lock?' bosslock':''}" data-id="${id}">${art}<strong>${it.name}</strong><span class="price">${on?'Wearing ✓':owned?'Tap to wear':lock?`🏆 Beat ${bb?bb.name:it.from}`:`🪙 ${it.price}`}</span></button>`};
  $('#app').innerHTML=`
  <div class="playbar"><button class="iconbtn" id="sback" aria-label="Back to home">←</button><h1 class="gtitle">Pet shop</h1><span class="stat" style="margin-left:auto"><span class="coin3d">${ICON.coin}</span> ${S.coins}</span></div>
  <div class="pet shop-hero${bgClass()}" id="pet">${petSVG('happy')}</div>
  <p class="say" style="text-align:center">Tap an item to buy it. Tap something you own to wear it or take it off.</p>
  ${SLOTS.map(([slot,label])=>`<h2 class="section-title">${label}</h2><div class="shop-grid">${Object.entries(ACC).filter(([,it])=>it.slot===slot).map(([id,it])=>card(id,it)).join('')}</div>`).join('')}`;
  $('#sback').onclick=home;addNav('shop');
  document.querySelectorAll('.shop-item').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,it=ACC[id];
    if(!S.shop.owned.includes(id)){
      if(it.boss){const bb=BOSSES.find(b=>b.reward===id);toast(bb?`Beat ${bb.name} in Boss Battles to win this!`:`Beat ${it.from} in ${it.where} to win this!`);return}
      if(S.coins<it.price){toast(`You need ${it.price-S.coins} more coins. Keep practicing!`);return}

  });

const TESTCFG=[{n:12,min:30},{n:16,min:40},{n:20,min:50},{n:25,min:40}];
function buildTest(band,n){
  let qs=shuffle(WP.filter(p=>p.band===band)).slice(0,Math.round(n*.4)).map(p=>({...p,kind:'word'}));
  const tpl=GEN.filter(t=>t.band===band);let pool=[];
  while(qs.length<n){if(!pool.length)pool=shuffle([...tpl]);const t=pool.pop();qs.push(Object.assign({id:t.id,band,kind:'word'},t.make()))}
  qs=shuffle(qs);if(band<3)qs.sort((x,y)=>(x.pts||3)-(y.pts||3));return qs;
}

function submitTest(timeUp){
  clearInterval(G.tick);const used=Math.min(Date.now()-G.t0,G.limit);cleanup();
  const qs=G.qs,band=G.band;let score=0,max=0,correct=0;const by={};
  qs.forEach((p,i)=>{const pts=band<3?(p.pts||3):1,ok=G.ans[i]===p.a;max+=pts;if(ok){score+=pts;correct++}
    const b=by[p.st]||(by[p.st]=[0,0]);b[1]++;if(ok)b[0]++;

  S.tests.push({d:dkey(),grade:S.grade,score,max,correct,n:qs.length,ms:used});if(S.tests.length>30)S.tests.shift();save();
  const pct=correct/qs.length,lvUp=level()>level(G.startXp);if(lvUp)sfx('level');else if(pct>=.6)sfx('streak');
  const mm=Math.floor(used/60000),ss=Math.floor(used/1000)%60;
  $('#app').innerHTML=`<section class="results">
    <div class="pet bounce${bgClass()}">${petSVG(pct>=.6?'cheer':'happy')}</div>
    ${timeUp?'<p class="say">⏱ Time’s up! Your answers were turned in.</p>':''}
    <h1>${pct>=.85?'Outstanding!':pct>=.6?'Great job!':pct>=.35?'Good effort!':'Every test makes you stronger!'}</h1>
    <p class="bigscore">${score} / ${max} points</p>
    <p>${correct} of ${qs.length} correct in ${mm}:${String(ss).padStart(2,'0')}.${stage()>oldStage?` ${pet().name} ${pet().grow[stage()-2]}!`:lvUp?` ${pet().name} reached level ${level()}!`:''}</p>
    <div class="earn"><span class="stat">🪙 +${coins} coins</span><span class="stat">⭐ +${xp} points</span></div>
  </section>
  <h2 class="section-title">By strategy</h2>
  <div class="gcard skills">${Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[c,n]])=>`<div class="skill"><div class="skill-top"><span>${STRAT[k].icon} ${STRAT[k].name}</span><span>${c} of ${n}</span></div><div class="xpbar"><span style="width:${Math.round(100*c/n)}%;background:${c/n<.6?'var(--miss)':c/n<.8?'var(--sun)':'var(--leaf)'}"></span></div></div>`).join('')}</div>
  <h2 class="section-title">Review your answers</h2>
  <div class="review">${qs.map((p,i)=>{const a=G.ans[i],ok=a===p.a;return `<details class="gcard rq ${ok?'ok':a===undefined?'skip':'bad'}"><summary><span class="rmark">${ok?'✓':a===undefined?'–':'✗'}</span> Question ${i+1}</summary>
    <p class="wp-q">${p.q}</p>${p.figSVG||p.fig?`<div class="wp-fig">${p.figSVG||FIG[p.fig]()}</div>`:''}
    <p>${a===undefined?'You skipped this one.':`Your answer: ${'ABCDE'[a]}) ${p.ch[a]}`}<br><strong>Correct answer: ${'ABCDE'[p.a]}) ${p.ch[p.a]}</strong></p>${solList(p)}${stratLine(p)}</details>`}).join('')}</div>
  <p class="legal">Missed questions were added to Review mistakes so you can try them again.</p>
  <div class="actions" style="margin-top:16px"><button class="btn big" id="back">Home</button><button class="btn big ghost" id="again">New test</button></div>`;
  window.scrollTo(0,0);$('#back').onclick=home;$('#again').onclick=testIntro;
}


/* 3D floating background */
(function(){const d=document.createElement('div');d.className='bg3d';d.setAttribute('aria-hidden','true');
  const cols=['#FF7A85','#60A5FA','#5BD08A','#FFD84D','#A78BFA','#FF9F6E','#4FD1C5'];let h='';
  for(let i=0;i<7;i++){const sz=rnd(40,110);h+=`<i style="--c:${cols[i]};width:${sz}px;height:${sz}px;left:${rnd(-5,90)}%;top:${rnd(-5,90)}%;--t:${rnd(7,14)}s;--dx:${rnd(-40,40)}px;--dy:${rnd(-60,60)}px"></i>`}
  ['+','×','÷','=','−'].forEach((c,i)=>{h+=`<b style="--c:${cols[(i+2)%7]};left:${rnd(2,88)}%;top:${rnd(5,90)}%;--t:${rnd(9,16)}s">${c}</b>`});
  d.innerHTML=h;document.body.prepend(d);
  // Cards tilt toward the mouse (mouse only, so taps on phones stay simple)
  const sel='.mode,.pet-card,.daily,.petpick,.shop-item';
  document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest(sel);document.querySelectorAll('.tilting').forEach(x=>{if(x!==el){x.classList.remove('tilting');x.style.removeProperty('--rx');x.style.removeProperty('--ry')}});
    if(!el)return;const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;el.classList.add('tilting');el.style.setProperty('--ry',(px*10).toFixed(2)+'deg');el.style.setProperty('--rx',(-py*10).toFixed(2)+'deg')});
})();

home();
</script>
</body>
</html>
